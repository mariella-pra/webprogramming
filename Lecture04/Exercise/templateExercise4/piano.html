<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Piano</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container text-center my-5">
        <h1>Virtual Piano</h1>
        <p>Press the following keys to play the notes:</p>
        <ul class="list-inline">
            <li class="list-inline-item key-spacing">
                <i class="bi bi-keyboard"></i> <strong>A</strong> - C
            </li>
            <li class="list-inline-item key-spacing">
                <i class="bi bi-keyboard"></i> <strong>S</strong> - D
            </li>
            <li class="list-inline-item key-spacing">
                <i class="bi bi-keyboard"></i> <strong>D</strong> - E
            </li>
            <li class="list-inline-item key-spacing">
                <i class="bi bi-keyboard"></i> <strong>F</strong> - F
            </li>
            <li class="list-inline-item key-spacing">
                <i class="bi bi-keyboard"></i> <strong>G</strong> - G
            </li>
            <li class="list-inline-item key-spacing">
                <i class="bi bi-keyboard"></i> <strong>H</strong> - A
            </li>
            <li class="list-inline-item key-spacing">
                <i class="bi bi-keyboard"></i> <strong>J</strong> - B
            </li>
        </ul>

        <div class="d-flex justify-content-center">
            <div id="piano" class="piano">
                <div class="key white" data-note="C" id="keyC">C</div>
                <div class="key white" data-note="D" id="keyD">D</div>
                <div class="key white" data-note="E" id="keyE">E</div>
                <div class="key white" data-note="F" id="keyF">F</div>
                <div class="key white" data-note="G" id="keyG">G</div>
                <div class="key white" data-note="A" id="keyA">A</div>
                <div class="key white" data-note="B" id="keyB">B</div>

                <div class="key black" data-note="C#" id="keyCsharp">C#</div>
                <div class="key black" data-note="D#" id="keyDsharp">D#</div>
                <div class="key black" data-note="F#" id="keyFsharp">F#</div>
                <div class="key black" data-note="G#" id="keyGsharp">G#</div>
                <div class="key black" data-note="A#" id="keyAsharp">A#</div>
            </div>
        </div>

        <div id="note-line" class="mt-4"></div>
        <p class="text-muted mt-2"><small>Keyboard shortcuts: Space - Play/Pause / Esc -  Reset</small></p>
        
        <!-- Place Buttons here -->
         <div class="mb-4">
            <button id="btnLoad" class="btn btn-info">Load Song</button>
            <button id="btnPlay" class="btn btn-success" disabled>Play</button>
            <button id="btnPause" class="btn btn-warning" disabled>Pause</button>
            <button id="btnReset" class="btn btn-danger">Reset</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
