<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1 class="text-center my-4">Memory Game</h1>
        <div id="game-board" class="row justify-content-center"></div>
        <h3 class="text-center my-4">Moves: <span id="moves-count">0</span></h3>
        <h3 class="text-center my-4">Matched Pairs: <span id="matched-pairs">0</span></h3>
        <h4 class="text-center my-4">Last Try: <span id="time">--.--</span> Seconds</h4>

        <h3 class="text-center my-4">Difficulty: <span id="difficulty">Medium</span></h3>

        <div class="text-center">
            <button type="button" class="btn btn-primary" onclick="setDifficulty('Easy')">Easy</button>
            <button type="button" class="btn btn-warning" onclick="setDifficulty('Medium')">Medium</button>
            <button type="button" class="btn btn-danger" onclick="setDifficulty('Hard')">Hard</button>
        </div>
        <div id="message" class="text-center mt-4"></div>
    </div>
    <script>
        //1. CARD DATA SETUP
        //cards = ['★', '★', '▲', '▲'];
        cards = [];
        symbols = ['★' , '▲' , '●', '❤', '◆', '■',];
        const difficultyPairs = {
            Easy: 2,
            Medium: 4,
            Hard: 6
        };

        //3.1 FLIP ARRAY
        let flippedCards = [];
        let canFlip = true;
        let matchedPairs = 0;

        let moves = 0;
        let totalPairs = 2;
        let startTime = new Date();
        let endTime;

        setDifficulty('Easy');

        function setDifficulty(difficulty) {
            moves = 0;
            document.getElementById('moves-count').textContent = moves;
            totalPairs = difficultyPairs[difficulty];
            cards = [];
            for (let i = 0; i < totalPairs; i++) {
                const symbol = symbols[i];
                cards.push(symbol, symbol);
            }
            //reset game - without time reset
            resetValues();
            renderBoard();
        }

        //2.1 SHUFFLE
        function shuffle(array) {
            array.sort(() => Math.random() - 0.5);
            return array;
        }
        //2.2 RENDER BOARD
        function renderBoard(cardsBase) {
            const gameBoard = document.getElementById('game-board');
            gameBoard.innerHTML = '';

            const shuffledCards = shuffle(cards);

            shuffledCards.forEach((symbol) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.setAttribute('onclick', 'flipCard(this)');
                card.textContent = '?';
                card.dataset.symbol = symbol;
                gameBoard.appendChild(card);
            });
        }
        //renderBoard(cards);

        //called when clicked
        function flipCard(card) {
            //start timer
            if (moves === 0) {
                startTime = new Date();
            }

            if (!canFlip || card.classList.contains('flipped')) return;

            //3.2 ONLY 2 FLIPPED
            if (flippedCards.length === 2) return;

            //flip
            card.classList.add('flipped');
            //change ? to symbol
            card.textContent = card.dataset.symbol;


            //3.1 TRACK FLIPPED CARDS
            flippedCards.push(card);

            //display moves
            moves++;
            document.getElementById('moves-count').textContent = moves;

            //if 2 flipped - check if match
            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            const card1 = flippedCards[0];
            const card2 = flippedCards[1];

            //3.3  IF MATCH -> KEEP FLIPPED
            if (card1.dataset.symbol === card2.dataset.symbol) {
                //found -> check if game complete, empty flipped cards


                //4.1 TRACK MATCHED PAIRS
                matchedPairs++;
                document.getElementById('matched-pairs').textContent = matchedPairs;

                //bg color
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                }, 200);

                //reset flipped cards
                flippedCards = [];
                checkGameComplete();
            } else {
                //3.3 NO MATCH -> FLIP BACK
                canFlip = false;
                setTimeout(() => {
                    resetCard(card1);
                    resetCard(card2);
                    flippedCards = [];
                    canFlip = true;
                }, 1000);
            }
        }

        function checkGameComplete() {
            //4.2 MESSAGE ON COMPLETE
            if (matchedPairs === totalPairs) {
                setTimeout(() => {
                    alert('Congratulations! You found all pairs!');
                    resetGame();
                }, 500);
            }
        }

        function resetCard(card) {
            card.classList.remove('flipped', 'matched');
            card.textContent = '?';
        }

        //4.3 RESET, RESHUFFLE
        function resetGame() {
            //end and reset timer
            endTime = new Date();
            var timeDiff = (endTime - startTime) / 1000;
            document.getElementById('time').textContent = timeDiff.toFixed(2);
            startTime = new Date();

            //reset variables
            resetValues();
            //get all card elements (with card class) - reset
            const cards = document.getElementsByClassName('card');
            for (let i = 0; i < cards.length; i++) {
                resetCard(cards[i]);
            }

            //reset moves
            moves = 0;
            document.getElementById('moves-count').textContent = moves;

            renderBoard();
        }
        function resetValues() {
            flippedCards = [];
            canFlip = true;
            matchedPairs = 0;
            moves = 0;
        }
    </script>
</body>

</html>
